<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garment Management System</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark">G</div>
      <div><b id="brandName">Garment MS</b><small>WhatsApp customers, orders and stock</small></div>
    </div>
    <nav id="nav">
      <a href="#/dashboard" data-view="dashboard">Dashboard</a>
      <a href="#/chats" data-view="chats">Chats <span class="n" id="nChats"></span></a>
      <a href="#/customers" data-view="customers">Customers</a>
      <a href="#/orders" data-view="orders">Orders <span class="n" id="nOrders"></span></a>
      <a href="#/products" data-view="products">Products and stock <span class="n warn" id="nLow"></span></a>
      <a href="#/followups" data-view="followups">Follow-ups <span class="n warn" id="nFollow"></span></a>
      <a href="#/settings" data-view="settings">Settings and backup</a>
    </nav>
    <div class="rail-foot">Saved on this computer in<br><code>data/db.json</code></div>
  </aside>

  <div class="work">
    <header class="bar">
      <h1 id="title">Dashboard</h1>
      <form id="quick" class="quick" autocomplete="off">
        <input id="quickPhone" inputmode="tel" placeholder="Type a number, press Enter   ( / )" aria-label="Phone number">
        <select id="quickType" aria-label="File the number as">
          <option value="">Ask me the type</option>
          <option value="wholesale">File as wholesale</option>
          <option value="reseller">File as reseller</option>
          <option value="retail">File as retail</option>
          <option value="lead">File as lead</option>
          <option value="no_response">File as no response</option>
          <option value="other">File as other</option>
        </select>
        <button class="btn primary" type="submit">Save number</button>
        <button class="btn" type="button" data-act="bulk">Paste many</button>
      </form>
    </header>
    <main id="view"><div class="empty">Loading…</div></main>
  </div>
</div>

<dialog id="drawer" class="drawer" aria-label="Customer"></dialog>
<dialog id="dlg" class="dlg"></dialog>
<script src="/app.js"></script>
</body>
</html>
