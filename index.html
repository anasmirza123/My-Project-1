<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garment Management System</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">G</div>
      <div><b id="brandName">Garment MS</b><small>Customers, orders and stock</small></div>
    </div>
    <nav id="nav">
      <a href="#/dashboard" data-view="dashboard">Dashboard</a>
      <a href="#/customers" data-view="customers">Customers <span class="count" id="navCustomers"></span></a>
      <a href="#/orders" data-view="orders">Orders <span class="count" id="navOrders"></span></a>
      <a href="#/products" data-view="products">Products and stock</a>
      <a href="#/followups" data-view="followups">Follow-ups <span class="count warn" id="navFollow"></span></a>
      <a href="#/stock" data-view="stock">Stock report</a>
      <a href="#/settings" data-view="settings">Settings and backup</a>
    </nav>
    <div class="side-foot">Data is saved on this computer in <code>data/db.json</code></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <form id="intakeForm" class="intake" autocomplete="off">
        <input id="intakePhone" placeholder="New chat? Type the phone number (03xx xxxxxxx or +92…)" inputmode="tel">
        <button class="btn primary" type="submit">Save number</button>
      </form>
    </header>
    <main id="view"><div class="empty">Loading…</div></main>
  </div>
</div>
<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
